<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ToDoList</title>
</head>
<body>
<div class="todo">
    <div class="todo__box">
        <h2 class="todo__title">Список дел</h2>
        <div class="todo__row">
            <input class="todo__input" type="text" placeholder="Укажите задачу">
            <button class="todo__btn">Добавить</button>
        </div>
        <ul class="todo__list">
            <li class="checked">Задача</li>
            <li>Задача</li>
            <li>Задача</li>
            <li>Задача</li>
        </ul>
    </div>
</div>
</body>
</html>
